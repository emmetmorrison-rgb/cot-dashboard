function el(tag, cls, text, parent) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function svgEl(tag, attrs, parent, style) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (style) e.setAttribute('style', style);
  if (parent) parent.appendChild(e);
  return e;
}
function sign(v) { return v > 0 ? '+' : v < 0 ? MINUS : ''; }
function fInt(v) { return v == null ? 'n/a' : (v < 0 ? MINUS : '') + Math.abs(Math.round(v)).toLocaleString('en-US'); }
function fSigned(v) { return v == null ? 'n/a' : sign(Math.round(v)) + Math.abs(Math.round(v)).toLocaleString('en-US'); }
function f1(v) { return v == null ? 'n/a' : v.toFixed(1); }
function fPct(v) { return v == null ? 'n/a' : (v < 0 ? MINUS : '') + Math.abs(v).toFixed(1) + '%'; }
function fPctSigned(v) { if (v == null) return 'n/a'; var r = Math.round(v * 10) / 10; return sign(r) + Math.abs(r).toFixed(1) + '%'; }
function fDate(s, opts) {
  return new Date(s + 'T00:00:00Z').toLocaleDateString('en-US',
    Object.assign({ timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' }, opts || {}));
}
function fAxis(v, step) {
  var a = Math.abs(v), s;
  if (a >= 1e6) s = (a / 1e6).toLocaleString('en-US', { maximumFractionDigits: step < 1e5 ? 2 : 1 }) + 'M';
  else if (a >= 10000) s = (a / 1000).toLocaleString('en-US', { maximumFractionDigits: step < 1000 ? 1 : 0 }) + 'K';
  else s = a.toLocaleString('en-US', { maximumFractionDigits: step < 1 ? 1 : 0 });
  return (v < 0 && a > 0 ? MINUS : '') + s;
}
function niceStep(range, target) {
  var raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
}
function lineKey(color, parent) { var k = el('span', 'key', null, parent); k.style.background = color; return k; }
function heat(v) {
  if (v == null) return '';
  var d = Math.min(1, Math.abs(v - 50) / 50), pct = Math.round(d * 45);
  return 'color-mix(in srgb, ' + (v < 50 ? 'var(--lo)' : 'var(--hi)') + ' ' + pct + '%, var(--surface))';
}
var GROUP_COLOR = {};
D.markets[0].groups.forEach(function (g, i) { GROUP_COLOR[g.key] = COLORS[i]; });
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

// ---------- line chart with crosshair tooltip ----------
function lineChart(host, o) {
  host.textContent = '';
  var T = o.T, LAST = T.length - 1;
  var W = Math.max(260, host.clientWidth), H = o.height;
  var m = { t: 10, r: 12, b: 26, l: 50 };
  var iw = W - m.l - m.r, ih = H - m.t - m.b;
  var s0 = o.start, s1 = LAST, t0 = T[s0], t1 = T[s1];
  function X(i) { return m.l + (T[i] - t0) / (t1 - t0 || 1) * iw; }
  var lo = Infinity, hi = -Infinity;
  function see(v) { if (v != null) { if (v < lo) lo = v; if (v > hi) hi = v; } }
  for (var i = s0; i <= s1; i++) {
    o.series.forEach(function (s) { see(s.values[i]); });
    if (o.band) { see(o.band.lo[i]); see(o.band.hi[i]); }
  }
  if (o.zero) see(0);
  if (lo === Infinity) { lo = 0; hi = 1; }
  if (lo === hi) { lo -= 1; hi += 1; }
  var step = niceStep(hi - lo, ih < 160 ? 4 : 5);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  function Y(v) { return m.t + (hi - v) / (hi - lo) * ih; }

  var svg = svgEl('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': o.label }, host);
  var nTicks = Math.round((hi - lo) / step);
  for (var k = 0; k <= nTicks; k++) {
    var v = lo + k * step, y = Math.round(Y(v)) + 0.5, isZero = o.zero && Math.abs(v) < step * 1e-6;
    svgEl('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, 'stroke-width': 1 }, svg,
      'stroke:' + (isZero ? 'var(--axis)' : 'var(--grid)'));
    svgEl('text', { x: m.l - 8, y: y + 4, 'text-anchor': 'end', class: 'tick' }, svg).textContent = fAxis(isZero ? 0 : v, step);
  }
  // x ticks: years for long spans, months for short ones
  var span = (t1 - t0) / YEAR_MS, d0 = new Date(t0), d1 = new Date(t1), ticks = [];
  if (span > 2.2) {
    for (var yr = d0.getUTCFullYear() + 1; yr <= d1.getUTCFullYear(); yr++) ticks.push([Date.UTC(yr, 0, 1), String(yr)]);
  } else {
    var every = span > 1.2 ? 6 : 3;
    for (var yy = d0.getUTCFullYear(); yy <= d1.getUTCFullYear(); yy++)
      for (var mo = 0; mo < 12; mo += every) {
        var t = Date.UTC(yy, mo, 1);
        if (t > t0 && t < t1) ticks.push([t, new Date(t).toLocaleDateString('en-US', { month: 'short', year: '2-digit', timeZone: 'UTC' }).replace(' ', " '")]);
      }
  }
  var thin = Math.max(1, Math.ceil(ticks.length * 44 / iw));
  ticks.forEach(function (tk, j) {
    if ((ticks.length - 1 - j) % thin) return;
    var x = m.l + (tk[0] - t0) / (t1 - t0) * iw;
    svgEl('line', { x1: x, x2: x, y1: H - m.b, y2: H - m.b + 4 }, svg, 'stroke:var(--axis)');
    svgEl('text', { x: x, y: H - m.b + 17, 'text-anchor': 'middle', class: 'tick' }, svg).textContent = tk[1];
  });
  // band
  if (o.band) {
    var d = '', seg = [];
    var flush = function () {
      if (seg.length > 1) {
        d += 'M' + seg.map(function (i) { return X(i).toFixed(1) + ',' + Y(o.band.hi[i]).toFixed(1); }).join('L') +
          'L' + seg.slice().reverse().map(function (i) { return X(i).toFixed(1) + ',' + Y(o.band.lo[i]).toFixed(1); }).join('L') + 'Z';
      }
      seg = [];
    };
    for (var b = s0; b <= s1; b++) { if (o.band.lo[b] != null && o.band.hi[b] != null) seg.push(b); else flush(); }
    flush();
    svgEl('path', { d: d }, svg, 'fill:var(--band)');
  }
  // lines + end dots
  o.series.forEach(function (s) {
    var d = '', pen = false;
    for (var i = s0; i <= s1; i++) {
      var v = s.values[i];
      if (v == null) { pen = false; continue; }
      d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); pen = true;
    }
    svgEl('path', { d: d, fill: 'none', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg, 'stroke:' + s.color);
    var last = s.values[s1];
    if (last != null) svgEl('circle', { cx: X(s1), cy: Y(last), r: 4, 'stroke-width': 2 }, svg, 'fill:' + s.color + ';stroke:var(--surface)');
  });
  // hover layer
  var cross = svgEl('line', { y1: m.t, y2: H - m.b, 'stroke-width': 1, visibility: 'hidden' }, svg, 'stroke:var(--muted)');
  var dots = o.series.map(function (s) {
    return svgEl('circle', { r: 4, 'stroke-width': 2, visibility: 'hidden' }, svg, 'fill:' + s.color + ';stroke:var(--surface)');
  });
  var hit = svgEl('rect', { x: m.l, y: 0, width: iw, height: H - m.b, fill: 'transparent', tabindex: 0,
    'aria-label': o.label + '. Use the left and right arrow keys to read values.' }, svg);
  var tip = el('div', 'tip', null, host); tip.hidden = true;
  var cur = null;
  function show(i) {
    cur = i;
    var x = X(i);
    cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
    o.series.forEach(function (s, k) {
      var v = s.values[i];
      if (v == null) { dots[k].setAttribute('visibility', 'hidden'); return; }
      dots[k].setAttribute('cx', x); dots[k].setAttribute('cy', Y(v)); dots[k].setAttribute('visibility', 'visible');
    });
    tip.textContent = '';
    el('div', 'tip-date', 'Week of ' + fDate(o.dates[i]), tip);
    var rows = o.series.map(function (s) { return { color: s.color, value: o.fmt(s.values[i]), name: s.name, raw: s.values[i] }; });
    if (o.sortTip) rows.sort(function (a, b) { return (b.raw == null ? -1e18 : b.raw) - (a.raw == null ? -1e18 : a.raw); });
    rows.forEach(function (r) {
      var row = el('div', 'tip-row', null, tip);
      lineKey(r.color, row); el('strong', null, r.value, row); el('span', 'tip-name', r.name, row);
    });
    if (o.extra) o.extra(i).forEach(function (kv) {
      var row = el('div', 'tip-row', null, tip); el('strong', null, kv[1], row); el('span', 'tip-name', kv[0], row);
    });
    tip.hidden = false;
    var tw = tip.offsetWidth, left = x + 14;
    if (left + tw > W) left = x - 14 - tw;
    tip.style.left = Math.max(0, left) + 'px'; tip.style.top = m.t + 'px';
  }
  function hide() {
    cur = null; cross.setAttribute('visibility', 'hidden');
    dots.forEach(function (d) { d.setAttribute('visibility', 'hidden'); }); tip.hidden = true;
  }
  function idxAt(px) {
    var t = t0 + (px - m.l) / iw * (t1 - t0), a = s0, b = s1;
    while (b - a > 1) { var mid = (a + b) >> 1; if (T[mid] < t) a = mid; else b = mid; }
    return (t - T[a] < T[b] - t) ? a : b;
  }
  hit.addEventListener('pointermove', function (e) { var r = svg.getBoundingClientRect(); show(idxAt(e.clientX - r.left)); });
  hit.addEventListener('pointerleave', hide);
  hit.addEventListener('focus', function () { show(s1); });
  hit.addEventListener('blur', hide);
  hit.addEventListener('keydown', function (e) {
    if (cur == null) return;
    if (e.key === 'ArrowLeft') { show(Math.max(s0, cur - 1)); e.preventDefault(); }
    if (e.key === 'ArrowRight') { show(Math.min(s1, cur + 1)); e.preventDefault(); }
  });
}

  ' · released ' + fDate(D.release, { weekday: 'short' }), header);
var pills = el('div', 'pills', null, header);

var range = 3;
var RANGES = [['1Y', 1], ['3Y', 3], ['5Y', 5], ['All', 0]];
var renderCharts = function () {};

// ---------- one market's view ----------
function renderMarket(M) {
  view.textContent = '';
  var T = M.series.dates.map(function (s) { return Date.parse(s + 'T00:00:00Z'); });
  var LAST = T.length - 1;
  var U = M.unit;

  var mh = el('div', 'mhead', null, view);
  var mp = el('div', 'pills', null, mh);
  pill(mp, M.crosscheck.status === 'ok' ? 'var(--good)' : 'var(--muted)',
    M.crosscheck.status === 'ok' ? 'Matches CFTC ' + M.name + ' consolidated totals' : 'CFTC cross-check not available');
  pill(mp, 'var(--muted)', 'Open interest ' + fInt(M.oi) + ' ' + U + ' (' + fSigned(M.oi_chg) + ')');

  // Group cards
  var sec = el('section', null, null, view);
  sec.style.marginTop = '20px';
  el('h2', null, M.name + ': this week by trader group', sec);
  el('p', 'note', 'Net position in ' + U + '-equivalent contracts (' + U + ' + ' + M.micro + ' / 10). The strip shows where this week sits among the last ' +
    D.ext.replace('y', ' years') + ' of weekly net positions (0 = lowest, 100 = highest); the shaded ends are the extreme zones.', sec);
  var cards = el('div', 'cards', null, sec);
  M.groups.forEach(function (g) {
    var c = el('div', 'card gcard', null, cards);
    var head = el('div', 'head', null, c);
    var nm = el('div', 'name', null, head); lineKey(GROUP_COLOR[g.key], nm); el('h3', null, g.name, nm);
    if (g.extreme) el('span', 'badge', (g.extreme === 'low' ? '▼ Low' : '▲ High') + ' extreme', head);
    el('div', 'val', fSigned(g.net), c);
    el('div', 'meta', U + ' equivalents · ' + fPctSigned(g.pct_oi) + ' of open interest', c);
    el('div', 'meta', 'Week ' + fSigned(g.chg) + '  (longs ' + fSigned(g.long_chg) + ', shorts ' + fSigned(g.short_chg) + ')', c);
    var strip = el('div', 'strip', null, c);
    strip.setAttribute('role', 'img');
    strip.setAttribute('aria-label', D.ext + ' percentile ' + f1(g.pctile[D.ext]));
    el('div', 'track', null, strip);
    var zl = el('div', 'zone', null, strip); zl.style.left = '0'; zl.style.width = D.lo + '%'; zl.style.background = heat(0);
    var zh = el('div', 'zone', null, strip); zh.style.left = D.hi + '%'; zh.style.right = '0'; zh.style.background = heat(100);
    var p = g.pctile[D.ext];
    if (p != null) { var mk = el('div', 'mark', null, strip); mk.style.left = p + '%'; mk.style.background = GROUP_COLOR[g.key]; }
    var sl = el('div', 'strip-labels', null, c);
    el('span', null, '0', sl); el('span', null, D.ext + ' percentile ' + f1(p), sl); el('span', null, '100', sl);
  });

  // History table: percentile vs COT index
  var hs = el('section', null, null, view);
  el('h2', null, 'Where net positions sit in their history', hs);
  el('p', 'note', 'Two different measures. Percentile: the share of weeks in the window with a lower net position than this week. ' +
    'COT index: where this week falls between the window’s lowest (0) and highest (100) net position, so one outlier week can stretch it. ' +
    'Bold = positioning extreme (' + D.ext + ' percentile).', hs);
  var hc = el('div', 'card scroll', null, hs);
  var tbl = el('table', null, null, hc);
  var th = el('thead', null, null, tbl);
  var tr0 = el('tr', 'groups', null, th); el('th', null, '', tr0);
  var c1 = el('th', null, 'Percentile', tr0); c1.colSpan = D.windows.length;
  var c2 = el('th', null, 'COT index', tr0); c2.colSpan = D.windows.length;
  var tr1 = el('tr', null, null, th); el('th', null, 'Group', tr1);
  [0, 1].forEach(function () { D.windows.forEach(function (w) { el('th', null, w === 'full' ? 'Full' : w, tr1); }); });
  var tb = el('tbody', null, null, tbl);
  function heatRow(nameNode, pct, idx, flagWindow) {
    var tr = el('tr', null, null, tb);
    var td0 = el('td', null, null, tr); td0.appendChild(nameNode);
    D.windows.forEach(function (w) {
      var td = el('td', null, f1(pct[w]), tr); td.style.background = heat(pct[w]);
      if (w === flagWindow && pct[w] != null && (pct[w] <= D.lo || pct[w] >= D.hi)) {
        td.className = 'ext'; td.textContent = (pct[w] <= D.lo ? '▼ ' : '▲ ') + f1(pct[w]);
      }
    });
    D.windows.forEach(function (w) {
      var v = idx ? idx[w] : null;
      var td = el('td', null, idx ? f1(v) : '–', tr); if (idx) td.style.background = heat(v);
    });
  }
  M.groups.forEach(function (g) {
    var n = el('span', 'name'); lineKey(GROUP_COLOR[g.key], n); n.appendChild(document.createTextNode(g.name));
    heatRow(n, g.pctile, g.cotidx, D.ext);
  });
  heatRow(el('span', 'name', 'Lev. Funds gross short, % of OI'), M.lfs.pctile, null, null);
  var sc = el('div', 'scale', null, hc); el('span', null, 'Low', sc); el('span', 'bar', null, sc); el('span', null, 'High', sc);

  // Time range control + overview chart
  var cs = el('section', null, null, view);
  el('h2', null, 'Net positions over time', cs);
  el('p', 'note', U + '-equivalent contracts. Hover or tab into a chart to read weekly values.', cs);
  var controls = el('div', 'controls', null, cs);
  el('span', 'lbl', 'Range', controls);
  var btns = RANGES.map(function (r) {
    var b = el('button', null, r[0], controls); b.type = 'button';
    b.addEventListener('click', function () { range = r[1]; store('cot-range', String(range)); renderCharts(); });
    return [b, r[1]];
  });
  var ov = el('div', 'card', null, cs);
  var lg = el('div', 'legend', null, ov);
  M.groups.forEach(function (g) { var s = el('span', null, null, lg); lineKey(GROUP_COLOR[g.key], s); s.appendChild(document.createTextNode(g.name)); });
  var overview = el('div', 'chart', null, ov);

  // Small multiples
  var ms = el('section', null, null, view);
  el('h2', null, 'Each group against its own ' + D.ext.replace('y', '-year') + ' range', ms);
  el('p', 'note', 'Shaded band: the ' + D.lo + 'th to ' + D.hi + 'th percentile of the trailing ' + D.ext.replace('y', ' years') +
    ' of weekly values. A line outside the band is a positioning extreme. Uses the same range as above.', ms);
  var grid = el('div', 'multiples', null, ms);
  var panels = M.groups.map(function (g) {
    return { name: g.name, color: GROUP_COLOR[g.key], data: M.series[g.key], fmt: fSigned, unit: 'net',
      now: 'Net ' + fSigned(g.net) + ' · ' + D.ext + ' pct ' + f1(g.pctile[D.ext]) };
  });
  panels.push({ name: 'Leveraged Funds gross short, % of OI', color: GROUP_COLOR.lev_funds, data: M.series.lfs,
    fmt: fPct, unit: 'pct', now: fPct(M.lfs.value) + ' · ' + D.ext + ' pct ' + f1(M.lfs.pctile[D.ext]) });
  panels.forEach(function (p) {
    var c = el('div', 'card', null, grid);
    var hd = el('div', 'panel-head', null, c);
    var nm = el('div', 'name', null, hd);
    lineKey(p.color, nm); el('h3', null, p.name, nm);
    el('span', 'now', p.now, hd);
    p.host = el('div', 'chart', null, c);
  });

  renderCharts = function () {
    btns.forEach(function (b) { b[0].setAttribute('aria-pressed', String(b[1] === range)); });
    var s = 0;
    if (range) { var cut = T[LAST] - range * YEAR_MS; while (s < LAST && T[s] < cut) s++; }
    lineChart(overview, {
      T: T, dates: M.series.dates, start: s, height: 300, zero: true, fmt: fSigned, sortTip: true,
      label: M.name + ' net positions by trader group, ' + U + ' equivalents',
      series: M.groups.map(function (g) { return { name: g.name, color: GROUP_COLOR[g.key], values: M.series[g.key].net }; })
    });
    panels.forEach(function (p) {
      lineChart(p.host, {
        T: T, dates: M.series.dates, start: s, height: 190, zero: p.unit === 'net', fmt: p.fmt,
        label: M.name + ' ' + p.name,
        series: [{ name: p.unit === 'net' ? 'net ' + U : 'of OI', color: p.color, values: p.data.net }],
        band: { lo: p.data.lo, hi: p.data.hi },
        extra: function (i) {
          return [[D.ext + ' band', p.fmt(p.data.lo[i]) + ' to ' + p.fmt(p.data.hi[i])],
                  [D.ext + ' percentile', f1(p.data.pctile[i])]];
        }
      });
    });
  };

  // Recent weeks table (also the table view for the charts)
  var rs = el('section', null, null, view);
  el('h2', null, 'Recent weeks', rs);
  el('p', 'note', 'Net positions in ' + U + ' equivalents for the last 13 weeks, newest first.', rs);
  var rc = el('div', 'card scroll', null, rs);
  var rt = el('table', null, null, rc);
  var rh = el('tr', null, null, el('thead', null, null, rt));
  el('th', null, 'Week of', rh);
  M.groups.forEach(function (g) { el('th', null, g.name, rh); });
  el('th', null, 'Open interest', rh); el('th', null, 'LF gross short', rh);
  var rb = el('tbody', null, null, rt);
  for (var i = LAST; i >= Math.max(0, LAST - 12); i--) {
    var tr = el('tr', null, null, rb);
    el('td', null, fDate(M.series.dates[i]), tr);
    M.groups.forEach(function (g) { el('td', null, fSigned(M.series[g.key].net[i]), tr); });
    el('td', null, fInt(M.series.oi[i]), tr);
    el('td', null, fPct(M.series.lfs.net[i]), tr);
  }

  var mn = el('div', 'mnotes', null, view);
  el('strong', null, M.name + ' data notes', mn);
  var nl = el('ul', null, null, mn);
  M.notes.forEach(function (n) { el('li', null, n, nl); });
  el('li', null, 'Cross-check: ' + M.crosscheck.detail + '.', nl);

  renderCharts();
}

function select(key, remember) {
  var M = D.markets.filter(function (m) { return m.key === key; })[0] || D.markets[0];
  mBtns.forEach(function (b) { b[0].setAttribute('aria-pressed', String(b[1] === M.key)); });
  if (remember) { store('cot-market', M.key); try { history.replaceState(null, '', '#' + M.key); } catch (e) {} }
  renderMarket(M);
}

var savedRange = parseInt(store('cot-range'), 10);
if ([0, 1, 3, 5].indexOf(savedRange) >= 0) range = savedRange;
select((location.hash || '').slice(1) || store('cot-market') || D.markets[0].key, false);
window.addEventListener('hashchange', function () { select(location.hash.slice(1), true); });
var rt0;
window.addEventListener('resize', function () { clearTimeout(rt0); rt0 = setTimeout(function () { renderCharts(); }, 150); });
})();
</script>
